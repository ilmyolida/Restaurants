<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Restoran</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #f5f0e8;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #e67e22; text-align: center; margin-bottom: 30px; }
        .card {
            background: #141414;
            border-radius: 28px;
            padding: 25px;
            border: 1px solid #2a2a2a;
            margin-bottom: 25px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 50px;
            border: 1px solid #2a2a2a;
            background: #0d0d0d;
            color: white;
        }
        button { background: #e67e22; color: white; cursor: pointer; font-weight: bold; }
        .food-item {
            background: #0d0d0d;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn { background: #e74c3c; width: auto; padding: 8px 20px; }
        .message { padding: 10px; border-radius: 50px; margin-top: 10px; text-align: center; display: none; }
        .success { background: rgba(39,174,96,0.2); color: #27ae60; border: 1px solid #27ae60; }
        .error { background: rgba(231,76,60,0.2); color: #e74c3c; border: 1px solid #e74c3c; }
    </style>
</head>
<body>
<div class="container">
    <h1>⚙️ Админ панели</h1>
    
    <div class="card">
        <h3>➕ Жаңы тамак кошуу</h3>
        <input type="text" id="foodName" placeholder="Тамактын аты">
        <input type="number" id="foodPrice" placeholder="Баасы (сом)">
        <input type="text" id="foodDesc" placeholder="Тавсифи">
        <input type="text" id="foodIcon" placeholder="Эмодзи (мис: 🍲)">
        <button id="addFoodBtn">➕ Тамак кошуу</button>
        <div id="adminMsg" class="message"></div>
    </div>
    
    <div class="card">
        <h3>📋 Учурдагы меню</h3>
        <div id="foodList"></div>
    </div>
    
    <div class="card">
        <h3>🔐 Токен жөндөөлөрү</h3>
        <input type="password" id="githubToken" placeholder="GitHub токен (керек эмес)">
        <button id="saveTokenBtn">💾 Токенди сактоо</button>
    </div>
    
    <p style="text-align: center; margin-top: 20px;"><a href="index.html" style="color: #e67e22;">← Сайтка кайтуу</a></p>
</div>

<script>
    let menu = JSON.parse(localStorage.getItem("restaurant_menu")) || [
        { name: "Бешбармак", price: 300, desc: "Классикалык кыргыз тамагы", icon: "🍲" },
        { name: "Манты", price: 250, desc: "Бууга бышырылган", icon: "🥟" },
        { name: "Лагман", price: 220, desc: "Колго согулган кесме", icon: "🍜" },
        { name: "Куурдак", price: 350, desc: "Козу эти менен", icon: "🍖" }
    ];
    
    function saveMenu() { localStorage.setItem("restaurant_menu", JSON.stringify(menu)); }
    
    function renderFoodList() {
        const listDiv = document.getElementById("foodList");
        listDiv.innerHTML = "";
        menu.forEach((item, idx) => {
            listDiv.innerHTML += `
                <div class="food-item">
                    <div><strong>${item.icon || "🍽️"} ${item.name}</strong> - ${item.price} сом<br><small>${item.desc || ""}</small></div>
                    <button class="delete-btn" onclick="deleteFood(${idx})">Өчүрүү</button>
                </div>`;
        });
    }
    
    window.deleteFood = function(idx) {
        if (confirm("Бул тамакты өчүрүү?")) {
            menu.splice(idx, 1);
            saveMenu();
            renderFoodList();
            showMsg("adminMsg", "✅ Тамак өчүрүлдү!", "success");
        }
    };
    
    function showMsg(elId, text, type) {
        const el = document.getElementById(elId);
        if (el) { el.innerText = text; el.className = `message ${type}`; el.style.display = "block"; setTimeout(() => el.style.display = "none", 3000); }
    }
    
    document.getElementById("addFoodBtn").onclick = () => {
        const name = document.getElementById("foodName").value.trim();
        const price = parseInt(document.getElementById("foodPrice").value);
        const desc = document.getElementById("foodDesc").value.trim();
        const icon = document.getElementById("foodIcon").value.trim() || "🍽️";
        if (!name || !price) { showMsg("adminMsg", "Тамактын атын жана баасын жазыңыз!", "error"); return; }
        menu.push({ name, price, desc, icon });
        saveMenu();
        renderFoodList();
        document.getElementById("foodName").value = "";
        document.getElementById("foodPrice").value = "";
        document.getElementById("foodDesc").value = "";
        document.getElementById("foodIcon").value = "";
        showMsg("adminMsg", "✅ Тамак кошулду!", "success");
    };
    
    document.getElementById("saveTokenBtn").onclick = () => {
        const token = document.getElementById("githubToken").value.trim();
        if (token) { localStorage.setItem("github_token", token); showMsg("adminMsg", "✅ Токен сакталды!", "success"); }
        else { showMsg("adminMsg", "❌ Токен жазылбады", "error"); }
    };
    
    renderFoodList();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin panel | Restoran</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #f0ede8; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { background: #2c3e50; color: white; padding: 20px; border-radius: 30px; text-align: center; margin-bottom: 25px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 25px; text-align: center; }
        .stat-value { font-size: 2rem; font-weight: bold; color: #e67e22; }
        .chart-container { background: white; border-radius: 25px; padding: 20px; margin: 20px 0; }
        .form-card { background: white; border-radius: 25px; padding: 20px; margin: 20px 0; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 50px; border: 1px solid #ddd; }
        button { background: #e67e22; color: white; font-weight: bold; cursor: pointer; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: white; border: none; padding: 10px 20px; border-radius: 50px; cursor: pointer; }
        .tab-btn.active { background: #6b3e1c; color: white; }
        .tab-pane { display: none; }
        .tab-pane.active-tab { display: block; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>📊 Admin panel</h1><p>Statistika va harajatlar</p></div>
    <div class="tabs"><button class="tab-btn active" data-tab="stats">Statistika</button><button class="tab-btn" data-tab="expenses">Harajatlar</button><button class="tab-btn" data-tab="token">Token</button></div>
    <div id="stats" class="tab-pane active-tab"><div class="stats-grid" id="statsGrid"></div><div class="chart-container"><canvas id="revenueChart"></canvas></div></div>
    <div id="expenses" class="tab-pane"><div class="form-card"><h3>➕ Harajat qo‘shish</h3><input type="text" id="expenseName" placeholder="Masalan: Elektr"><input type="number" id="expenseAmount" placeholder="Summa"><button id="addExpenseBtn">➕ Qo‘shish</button><div id="expenseList"></div></div></div>
    <div id="token" class="tab-pane"><div class="form-card"><h3>🔐 GitHub Token</h3><input type="password" id="githubToken" placeholder="Token"><button id="saveTokenBtn">Saqlash</button></div></div>
</div>
<script>
    const REPO_OWNER = "ilmyolida", REPO_NAME = "Restaurants";
    let orders = [], statsData = { expenses: [] }, githubToken = localStorage.getItem("github_token") || "", chart;
    async function fetchJSON(filename) { const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${filename}`; try { const res = await fetch(url); return await res.json(); } catch(e) { return []; } }
    async function saveStats(data) { if (!githubToken) return; const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/stats.json`; let sha = ""; try { const res = await fetch(url, { headers: { Authorization: `token ${githubToken}` } }); if (res.ok) sha = (await res.json()).sha; } catch(e) {} const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))); await fetch(url, { method: "PUT", headers: { Authorization: `token ${githubToken}`, "Content-Type": "application/json" }, body: JSON.stringify({ message: "Update stats", content, sha }) }); }
    async function loadAll() { orders = await fetchJSON("orders.json"); statsData = await fetchJSON("stats.json"); if (!statsData.expenses) statsData.expenses = []; updateStats(); }
    function updateStats() { const total = orders.reduce((s,o)=> s + (o.total||0),0); const orderCount = orders.length; const avg = orderCount? total/orderCount:0; const expensesTotal = statsData.expenses.reduce((s,e)=> s + e.amount,0); const profit = total - expensesTotal; document.getElementById("statsGrid").innerHTML = `<div class="stat-card"><div class="stat-value">${total.toLocaleString()} сом</div><div>Umumiy savdo</div></div><div class="stat-card"><div class="stat-value">${orderCount}</div><div>Buyurtmalar</div></div><div class="stat-card"><div class="stat-value">${Math.round(avg).toLocaleString()} сом</div><div>O‘rtacha</div></div><div class="stat-card"><div class="stat-value">${expensesTotal.toLocaleString()} сом</div><div>Harajatlar</div></div><div class="stat-card"><div class="stat-value">${profit.toLocaleString()} сом</div><div>Sof foyda</div></div>`; const daily = {}; orders.forEach(o=>{ let d = o.date?.slice(0,10); if(d) daily[d]=(daily[d]||0)+(o.total||0); }); if(chart) chart.destroy(); const ctx = document.getElementById('revenueChart').getContext('2d'); chart = new Chart(ctx, { type: 'bar', data: { labels: Object.keys(daily), datasets: [{ label: 'Kunlik savdo', data: Object.values(daily), backgroundColor: '#e67e22' }] } }); const expenseDiv = document.getElementById("expenseList"); expenseDiv.innerHTML = statsData.expenses.map((e,i)=>`<div style="background:white; padding:10px; margin:5px 0; border-radius:50px;">${e.name}: ${e.amount} сом <button onclick="deleteExpense(${i})">🗑️</button></div>`).join(""); }
    window.deleteExpense = async function(idx) { statsData.expenses.splice(idx,1); await saveStats(statsData); loadAll(); };
    document.getElementById("addExpenseBtn").onclick = async () => { const name = document.getElementById("expenseName").value; const amount = parseInt(document.getElementById("expenseAmount").value); if(name && amount) { statsData.expenses.push({ name, amount }); await saveStats(statsData); loadAll(); document.getElementById("expenseName").value = ""; document.getElementById("expenseAmount").value = ""; } };
    document.getElementById("saveTokenBtn").onclick = () => { const token = document.getElementById("githubToken").value; if(token) { localStorage.setItem("github_token", token); githubToken = token; alert("Token saqlandi!"); } };
    document.querySelectorAll(".tab-btn").forEach(btn=>{ btn.onclick=()=>{ document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); document.querySelectorAll(".tab-pane").forEach(p=>p.classList.remove("active-tab")); document.getElementById(btn.dataset.tab).classList.add("active-tab"); }; });
    if(githubToken) document.getElementById("githubToken").value = githubToken;
    loadAll();
</script>
</body>
</html>

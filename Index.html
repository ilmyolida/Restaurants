<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Restoran | Меню жана Заказ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --border: #2a2a2a;
            --accent: #e67e22;
            --text: #f5f0e8;
            --text-muted: #aaa;
        }
        body.light {
            --bg: #f8f9fa;
            --card: #ffffff;
            --border: #e9ecef;
            --text: #2c3e50;
            --text-muted: #6c757d;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s;
        }
        .top-bar { display: flex; justify-content: flex-end; gap: 12px; padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--border); }
        .top-btn { background: var(--bg); border: 1px solid var(--border); padding: 8px 20px; border-radius: 40px; cursor: pointer; color: var(--text); }
        .header { background: linear-gradient(135deg, var(--accent), #d35400); color: white; padding: 30px 20px; text-align: center; }
        .header h1 { font-size: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 25px; }
        .tabs { display: flex; gap: 15px; margin: 20px 0 35px; flex-wrap: wrap; justify-content: center; }
        .tab-btn { background: var(--card); border: 1px solid var(--border); padding: 12px 28px; border-radius: 50px; font-weight: 600; cursor: pointer; color: var(--text); }
        .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .section-title { font-size: 1.6rem; margin: 25px 0 25px; color: var(--accent); border-left: 4px solid var(--accent); padding-left: 18px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 28px; }
        .menu-card { background: var(--card); border-radius: 28px; overflow: hidden; border: 1px solid var(--border); transition: 0.3s; cursor: pointer; }
        .menu-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .menu-img { height: 160px; background: linear-gradient(145deg, #2a2a2a, #1a1a1a); display: flex; align-items: center; justify-content: center; font-size: 4rem; }
        body.light .menu-img { background: linear-gradient(145deg, #e8d5b5, #d4b896); }
        .menu-info { padding: 20px; text-align: center; }
        .menu-info h3 { font-size: 1.4rem; margin-bottom: 8px; }
        .menu-desc { color: var(--text-muted); font-size: 0.85rem; margin: 8px 0; }
        .price { font-size: 1.5rem; font-weight: bold; color: var(--accent); margin: 12px 0; }
        .order-btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 50px; font-weight: 600; cursor: pointer; width: 100%; }
        .form-card { background: var(--card); border-radius: 32px; padding: 28px; border: 1px solid var(--border); margin-top: 20px; }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 18px; }
        .form-row input, .form-row select, .form-row textarea { flex: 1; padding: 14px 18px; border: 1px solid var(--border); border-radius: 50px; background: var(--bg); color: var(--text); }
        .submit-btn { background: #27ae60; width: 100%; padding: 14px; border-radius: 50px; font-weight: bold; color: white; border: none; cursor: pointer; }
        .tab-pane { display: none; animation: fade 0.3s; }
        .tab-pane.active-tab { display: block; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        footer { text-align: center; padding: 35px; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 50px; }
        .message { padding: 12px; border-radius: 50px; margin-top: 15px; display: none; text-align: center; }
        .success { background: rgba(39,174,96,0.2); color: #27ae60; border: 1px solid #27ae60; }
        .error { background: rgba(231,76,60,0.2); color: #e74c3c; border: 1px solid #e74c3c; }
        .note { font-size: 0.8rem; color: var(--accent); text-align: center; margin-top: 15px; }
        @media (max-width: 600px) { .header h1 { font-size: 1.4rem; } .tab-btn { padding: 8px 18px; } .form-row { flex-direction: column; } }
    </style>
</head>
<body>
<div class="top-bar">
    <button class="top-btn" id="langToggle">🇺🇿 O'zbekcha</button>
    <button class="top-btn" id="themeToggle">☀️ Light</button>
</div>
<div class="header">
    <h1 id="mainTitle">🍽️ Kafe & Ресторан</h1>
    <p id="subTitle">Табигый даам | Жылуу маанай | Тез жеткирүү</p>
</div>
<div class="container">
    <div class="tabs">
        <button class="tab-btn active" data-tab="menu">📋 Меню</button>
        <button class="tab-btn" data-tab="order">🚚 Заказ берүү</button>
        <button class="tab-btn" data-tab="reserve">🪑 Стол заказдоо</button>
    </div>

    <div id="menu" class="tab-pane active-tab">
        <h2 class="section-title" id="menuTitle">Биздин меню</h2>
        <div class="menu-grid" id="menuGrid"></div>
    </div>

    <div id="order" class="tab-pane">
        <h2 class="section-title" id="orderTitle">Жеткирүү менен заказ</h2>
        <div class="form-card">
            <div class="form-row"><input type="text" id="orderName" placeholder="Атыңыз"></div>
            <div class="form-row"><input type="text" id="orderUsername" placeholder="Telegram username (@username)"></div>
            <div class="form-row"><select id="orderProduct"></select></div>
            <div class="form-row"><input type="number" id="orderQty" placeholder="Саны" value="1" min="1"></div>
            <div class="form-row"><textarea id="orderAddress" rows="2" placeholder="Дарегиңиз (көчө, үй)"></textarea></div>
            <button class="submit-btn" id="submitOrder">📦 Заказ берүү</button>
            <div class="note">🤖 @Conversationorderbot бот аркылуу хабар аласыз</div>
            <div id="orderMessage" class="message"></div>
        </div>
    </div>

    <div id="reserve" class="tab-pane">
        <h2 class="section-title" id="reserveTitle">Стол заказдоо</h2>
        <div class="form-card">
            <div class="form-row"><input type="text" id="reserveName" placeholder="Атыңыз"></div>
            <div class="form-row"><input type="text" id="reserveUsername" placeholder="Telegram username (@username)"></div>
            <div class="form-row"><input type="date" id="reserveDate"></div>
            <div class="form-row"><input type="time" id="reserveTime"></div>
            <div class="form-row"><input type="number" id="reserveTable" placeholder="Стол номери"></div>
            <div class="form-row"><input type="number" id="reserveGuests" placeholder="Адам саны" min="1"></div>
            <button class="submit-btn" id="submitReserve">✅ Стол заказдоо</button>
            <div class="note">🤖 @Conversationorderbot бот аркылуу хабар аласыз</div>
            <div id="reserveMessage" class="message"></div>
        </div>
    </div>
    
    <footer>© 2025 | <a href="https://t.me/Conversationorderbot" style="color: var(--accent);">🤖 Ботко өтүү</a> | <a href="admin.html" style="color: var(--accent);">⚙️ Админ панели</a></footer>
</div>

<script>
    // ====================== КОНФИГУРАЦИЯ ======================
    const BOT_TOKEN = "8863904509:AAFCnx-finHBwgL5RaglmLrsOVI_X2_np8I";
    const CHAT_ID = "6360110232";
    
    // Меню (сайт ичинде сакталат)
    let menu = [
        { name: "Бешбармак", price: 300, desc: "Классикалык кыргыз тамагы", icon: "🍲" },
        { name: "Манты", price: 250, desc: "Бууга бышырылган", icon: "🥟" },
        { name: "Лагман", price: 220, desc: "Колго согулган кесме", icon: "🍜" },
        { name: "Куурдак", price: 350, desc: "Козу эти менен", icon: "🍖" },
        { name: "Көк чай", price: 50, desc: "Тостон ысык чай", icon: "🍵" },
        { name: "Компот", price: 80, desc: "Үй компоту", icon: "🥤" }
    ];
    
    let currentLang = "ky";
    let currentTheme = localStorage.getItem("theme") || "dark";
    
    const translations = {
        ky: { mainTitle: "🍽️ Kafe & Ресторан", subTitle: "Табигый даам | Жылуу маанай | Тез жеткирүү", menuTitle: "Биздин меню", orderTitle: "Жеткирүү менен заказ", reserveTitle: "Стол заказдоо" },
        uz: { mainTitle: "🍽️ Kafe & Restoran", subTitle: "Tabiiy taom | Issiq muhit | Tez yetkazib berish", menuTitle: "Bizning menyu", orderTitle: "Yetkazib berish orqali buyurtma", reserveTitle: "Restoranda stol band qilish" }
    };
    
    function renderMenu() {
        const grid = document.getElementById("menuGrid");
        const select = document.getElementById("orderProduct");
        if (!grid) return;
        grid.innerHTML = "";
        select.innerHTML = "";
        menu.forEach((item, idx) => {
            grid.innerHTML += `<div class="menu-card" onclick="quickOrder(${idx})"><div class="menu-img">${item.icon}</div><div class="menu-info"><h3>${item.name}</h3><div class="menu-desc">${item.desc}</div><div class="price">${item.price} сом</div><button class="order-btn">🛒 Заказ берүү</button></div></div>`;
            select.innerHTML += `<option value="${idx}">${item.name} - ${item.price} сом</option>`;
        });
    }
    
    window.quickOrder = function(idx) {
        document.querySelector('[data-tab="order"]').click();
        document.getElementById("orderProduct").value = idx;
        document.getElementById("orderQty").value = 1;
        window.scrollTo({ top: document.getElementById("order").offsetTop, behavior: "smooth" });
    };
    
    async function sendToTelegram(order) {
        let msg = `🆕 ЯНГЫ ЗАКАЗ!\n━━━━━━━━━━━━━━━\n👤 ${order.name}\n🆔 ${order.username}\n`;
        if (order.type === "delivery") {
            msg += `🍽 ${order.product} x${order.qty} = ${order.total} сом\n📍 ${order.address}`;
        } else {
            msg += `🪑 Стол ${order.table}\n👥 ${order.guests} адам\n📅 ${order.dateTime}`;
        }
        try {
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: msg })
            });
            return response.ok;
        } catch(e) { return false; }
    }
    
    function showMsg(elId, text, type) {
        const el = document.getElementById(elId);
        if (el) { el.innerText = text; el.className = `message ${type}`; el.style.display = "block"; setTimeout(() => el.style.display = "none", 5000); }
    }
    
    document.getElementById("submitOrder").onclick = async () => {
        const name = document.getElementById("orderName").value.trim();
        let username = document.getElementById("orderUsername").value.trim();
        const productIdx = parseInt(document.getElementById("orderProduct").value);
        const qty = parseInt(document.getElementById("orderQty").value);
        const address = document.getElementById("orderAddress").value.trim();
        if (!name || !username || !address) { showMsg("orderMessage", "Бардык талааларды толтуруңуз!", "error"); return; }
        if (!username.startsWith('@')) username = '@' + username;
        const item = menu[productIdx];
        const order = { type: "delivery", name, username, product: item.name, qty, total: item.price * qty, address };
        if (await sendToTelegram(order)) {
            showMsg("orderMessage", "✅ Заказ кабыл алынды!", "success");
            document.getElementById("orderName").value = ""; document.getElementById("orderUsername").value = ""; document.getElementById("orderAddress").value = ""; document.getElementById("orderQty").value = "1";
        } else { showMsg("orderMessage", "❌ Ката кетти. Telegram ботту текшериңиз.", "error"); }
    };
    
    document.getElementById("submitReserve").onclick = async () => {
        const name = document.getElementById("reserveName").value.trim();
        let username = document.getElementById("reserveUsername").value.trim();
        const date = document.getElementById("reserveDate").value;
        const time = document.getElementById("reserveTime").value;
        const table = document.getElementById("reserveTable").value;
        const guests = document.getElementById("reserveGuests").value;
        if (!name || !username || !date || !time || !table) { showMsg("reserveMessage", "Бардык талааларды толтуруңуз!", "error"); return; }
        if (!username.startsWith('@')) username = '@' + username;
        const order = { type: "reserve", name, username, table, guests, dateTime: `${date} ${time}` };
        if (await sendToTelegram(order)) {
            showMsg("reserveMessage", "✅ Стол заказдалды!", "success");
            document.getElementById("reserveName").value = ""; document.getElementById("reserveUsername").value = ""; document.getElementById("reserveDate").value = ""; document.getElementById("reserveTime").value = ""; document.getElementById("reserveTable").value = ""; document.getElementById("reserveGuests").value = "";
        } else { showMsg("reserveMessage", "❌ Ката кетти", "error"); }
    };
    
    document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active-tab"));
            document.getElementById(btn.dataset.tab).classList.add("active-tab");
        });
    });
    
    function setLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        document.getElementById("mainTitle").innerText = t.mainTitle;
        document.getElementById("subTitle").innerText = t.subTitle;
        document.getElementById("menuTitle").innerText = t.menuTitle;
        document.getElementById("orderTitle").innerText = t.orderTitle;
        document.getElementById("reserveTitle").innerText = t.reserveTitle;
        localStorage.setItem("lang", lang);
    }
    
    function setTheme(theme) {
        currentTheme = theme;
        if (theme === "light") { document.body.classList.add("light"); document.getElementById("themeToggle").innerHTML = "🌙 Dark"; }
        else { document.body.classList.remove("light"); document.getElementById("themeToggle").innerHTML = "☀️ Light"; }
        localStorage.setItem("theme", theme);
    }
    
    document.getElementById("langToggle").onclick = () => setLanguage(currentLang === "ky" ? "uz" : "ky");
    document.getElementById("themeToggle").onclick = () => setTheme(currentTheme === "dark" ? "light" : "dark");
    
    const savedLang = localStorage.getItem("lang");
    if (savedLang) setLanguage(savedLang);
    else setLanguage("ky");
    
    setTheme(currentTheme);
    renderMenu();
</script>
</body>
    </html>

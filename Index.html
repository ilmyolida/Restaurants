<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Restoran | Меню жана Заказ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-primary: #2c3e50;
            --text-secondary: #6c757d;
            --card-bg: #ffffff;
            --border-color: #e9ecef;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
            --accent: #e67e22;
        }
        
        body.dark {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --text-primary: #f5f0e8;
            --text-secondary: #aaa;
            --card-bg: #1a1a1a;
            --border-color: #2a2a2a;
            --shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
        
        .top-bar {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 12px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .top-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            color: var(--text-primary);
        }
        .top-btn:hover { border-color: var(--accent); color: var(--accent); }
        
        .header {
            background: linear-gradient(135deg, var(--accent), #d35400);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 { font-size: 2rem; margin-bottom: 8px; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .tabs {
            display: flex;
            gap: 12px;
            margin: 20px 0 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-primary);
        }
        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: transparent;
        }
        
        .section-title {
            font-size: 1.6rem;
            margin: 20px 0 25px;
            color: var(--accent);
            border-left: 4px solid var(--accent);
            padding-left: 15px;
        }
        
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .menu-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: 0.3s;
            cursor: pointer;
        }
        .menu-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .menu-img {
            height: 150px;
            background: linear-gradient(145deg, #f0e0c0, #e8d5b5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
        body.dark .menu-img { background: linear-gradient(145deg, #2a2a2a, #1f1f1f); }
        .menu-info { padding: 18px; text-align: center; }
        .menu-info h3 { font-size: 1.3rem; }
        .price { font-size: 1.5rem; font-weight: bold; color: var(--accent); margin: 10px 0; }
        .order-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        
        .form-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            border: 1px solid var(--border-color);
        }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; }
        .form-row input, .form-row select, .form-row textarea {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 50px;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        textarea { border-radius: 20px !important; }
        .submit-btn {
            background: #27ae60;
            width: 100%;
            padding: 12px;
            border-radius: 50px;
            font-weight: bold;
            color: white;
            border: none;
            cursor: pointer;
        }
        
        .tab-pane { display: none; animation: fade 0.3s; }
        .tab-pane.active-tab { display: block; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        
        footer { text-align: center; padding: 30px; color: var(--text-secondary); border-top: 1px solid var(--border-color); margin-top: 40px; }
        
        .message {
            padding: 10px;
            border-radius: 50px;
            margin-top: 15px;
            display: none;
            text-align: center;
        }
        .success { background: rgba(39,174,96,0.2); color: #27ae60; }
        .error { background: rgba(231,76,60,0.2); color: #e74c3c; }
        
        @media (max-width: 600px) {
            .header h1 { font-size: 1.4rem; }
            .tab-btn { padding: 8px 18px; }
            .form-row { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="top-bar">
    <button class="top-btn" id="langToggle">🇺🇿 O'zbekcha</button>
    <button class="top-btn" id="themeToggle">🌙 Dark</button>
</div>
<div class="header">
    <h1 id="mainTitle">🍽️ Kafe & Ресторан</h1>
    <p id="subTitle">Табигый даам | Жылуу маанай | Тез жеткирүү</p>
</div>
<div class="container">
    <div class="tabs">
        <button class="tab-btn active" data-tab="menu-tab" id="tabMenu">📋 Меню</button>
        <button class="tab-btn" data-tab="order-tab" id="tabOrder">🚚 Заказ берүү</button>
        <button class="tab-btn" data-tab="reserve-tab" id="tabReserve">🪑 Стол заказдоо</button>
    </div>

    <div id="menu-tab" class="tab-pane active-tab">
        <h2 class="section-title" id="menuTitle">Биздин меню</h2>
        <div class="menu-grid" id="menuGrid"></div>
    </div>

    <div id="order-tab" class="tab-pane">
        <h2 class="section-title" id="orderTitle">Жеткирүү менен заказ</h2>
        <div class="form-card">
            <div class="form-row"><input type="text" id="orderName" placeholder="Атыңыз"></div>
            <div class="form-row"><input type="tel" id="orderPhone" placeholder="Телефон номери"></div>
            <div class="form-row"><select id="orderProduct"></select></div>
            <div class="form-row"><input type="number" id="orderQty" placeholder="Саны" value="1" min="1"></div>
            <div class="form-row"><textarea id="orderAddress" rows="2" placeholder="Дарегиңиз (көчө, үй, кире бериш)"></textarea></div>
            <button class="submit-btn" id="submitDeliveryOrder">📦 Заказ берүү</button>
            <div id="orderMessage" class="message"></div>
        </div>
    </div>

    <div id="reserve-tab" class="tab-pane">
        <h2 class="section-title" id="reserveTitle">Стол заказдоо</h2>
        <div class="form-card">
            <div class="form-row"><input type="text" id="reserveName" placeholder="Атыңыз"></div>
            <div class="form-row"><input type="tel" id="reservePhone" placeholder="Телефон номери"></div>
            <div class="form-row"><input type="date" id="reserveDate"></div>
            <div class="form-row"><input type="time" id="reserveTime"></div>
            <div class="form-row"><input type="number" id="reserveTable" placeholder="Стол номери"></div>
            <div class="form-row"><input type="number" id="reserveGuests" placeholder="Адам саны" min="1"></div>
            <button class="submit-btn" id="submitReserve">✅ Стол заказдоо</button>
            <div id="reserveMessage" class="message"></div>
        </div>
    </div>
    
    <footer>© 2025 | Бардык укуктар корголгон</footer>
</div>

<script>
    // ====================== TELEGRAM SOZLAMALARI ======================
    const BOT_TOKEN = "8863904509:AAFCnx-finHBwgL5RaglmLrsOVI_X2_np8I";
    const CHAT_ID = "6360110232";
    
    // ====================== MENYU MA'LUMOTLARI ======================
    const menu = [
        { name: "Бешбармак", price: 300, icon: "🍲", desc: "Классикалык кыргыз тамагы" },
        { name: "Манты", price: 250, icon: "🥟", desc: "Бууга бышырылган" },
        { name: "Лагман", price: 220, icon: "🍜", desc: "Колго согулган кесме" },
        { name: "Куурдак", price: 350, icon: "🍖", desc: "Козу эти менен" },
        { name: "Плов", price: 280, icon: "🍚", desc: "Тойгонго даамдуу" },
        { name: "Шорпо", price: 180, icon: "🥣", desc: "Ысык сорпо" },
        { name: "Самса", price: 120, icon: "🥐", desc: "Тоо наны" },
        { name: "Чай", price: 50, icon: "🍵", desc: "Кымыз, көк чай" }
    ];
    
    let currentLang = "ky";
    let currentTheme = localStorage.getItem("theme") || "light";
    
    // ====================== TIL MATNLARI ======================
    const translations = {
        ky: {
            mainTitle: "🍽️ Kafe & Ресторан",
            subTitle: "Табигый даам | Жылуу маанай | Тез жеткирүү",
            tabMenu: "📋 Меню",
            tabOrder: "🚚 Заказ берүү",
            tabReserve: "🪑 Стол заказдоо",
            menuTitle: "Биздин меню",
            orderTitle: "Жеткирүү менен заказ",
            reserveTitle: "Стол заказдоо",
            orderBtn: "📦 Заказ берүү",
            reserveBtn: "✅ Стол заказдоо"
        },
        uz: {
            mainTitle: "🍽️ Kafe & Restoran",
            subTitle: "Tabiiy taom | Issiq muhit | Tez yetkazib berish",
            tabMenu: "📋 Menyu",
            tabOrder: "🚚 Buyurtma berish",
            tabReserve: "🪑 Stol band qilish",
            menuTitle: "Bizning menyu",
            orderTitle: "Yetkazib berish orqali buyurtma",
            reserveTitle: "Restoranda stol band qilish",
            orderBtn: "📦 Buyurtma berish",
            reserveBtn: "✅ Stol band qilish"
        }
    };
    
    function setLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        document.getElementById("mainTitle").innerText = t.mainTitle;
        document.getElementById("subTitle").innerText = t.subTitle;
        document.getElementById("tabMenu").innerText = t.tabMenu;
        document.getElementById("tabOrder").innerText = t.tabOrder;
        document.getElementById("tabReserve").innerText = t.tabReserve;
        document.getElementById("menuTitle").innerText = t.menuTitle;
        document.getElementById("orderTitle").innerText = t.orderTitle;
        document.getElementById("reserveTitle").innerText = t.reserveTitle;
        document.getElementById("submitDeliveryOrder").innerText = t.orderBtn;
        document.getElementById("submitReserve").innerText = t.reserveBtn;
        localStorage.setItem("lang", lang);
    }
    
    function setTheme(theme) {
        currentTheme = theme;
        if (theme === "dark") {
            document.body.classList.add("dark");
            document.getElementById("themeToggle").innerHTML = "☀️ Light";
        } else {
            document.body.classList.remove("dark");
            document.getElementById("themeToggle").innerHTML = "🌙 Dark";
        }
        localStorage.setItem("theme", theme);
    }
    
    function toggleTheme() { setTheme(currentTheme === "dark" ? "light" : "dark"); }
    
    // ====================== TELEGRAM XABAR JIBERUU ======================
    async function sendTelegram(order) {
        let msg = "";
        if (order.type === "delivery") {
            msg = `🆕 ЯНГЫ ЗАКАЗ!\n━━━━━━━━━━━━━━━\n👤 Аты: ${order.name}\n📞 Тел: ${order.phone}\n🍽 Тамак: ${order.product}\n🔢 Саны: ${order.qty}\n💰 Жалпы: ${order.total} сом\n📍 Дареги: ${order.address}\n━━━━━━━━━━━━━━━\n⏰ ${new Date().toLocaleString()}`;
        } else {
            msg = `🆕 СТОЛ ЗАКАЗДОО!\n━━━━━━━━━━━━━━━\n👤 Аты: ${order.name}\n📞 Тел: ${order.phone}\n🪑 Стол: №${order.table}\n👥 Адам саны: ${order.guests}\n📅 Күнү: ${order.dateTime}\n━━━━━━━━━━━━━━━\n⏰ ${new Date().toLocaleString()}`;
        }
        try {
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: msg })
            });
            return response.ok;
        } catch(e) { 
            console.log("Telegram error:", e);
            return false;
        }
    }
    
    function showMsg(elId, text, type) {
        const el = document.getElementById(elId);
        if (el) { 
            el.innerText = text; 
            el.className = `message ${type}`; 
            el.style.display = "block"; 
            setTimeout(() => el.style.display = "none", 5000); 
        }
    }
    
    // ====================== MENYU KO'RSATISH ======================
    function loadMenu() {
        const grid = document.getElementById("menuGrid");
        const select = document.getElementById("orderProduct");
        grid.innerHTML = ""; 
        select.innerHTML = "";
        menu.forEach((item, idx) => {
            grid.innerHTML += `
                <div class="menu-card" onclick="quickOrder(${idx})">
                    <div class="menu-img">${item.icon}</div>
                    <div class="menu-info">
                        <h3>${item.name}</h3>
                        <div class="price">${item.price} сом</div>
                        <p style="font-size:0.8rem; opacity:0.7;">${item.desc}</p>
                        <button class="order-btn">🛒 Заказ берүү</button>
                    </div>
                </div>`;
            select.innerHTML += `<option value="${idx}">${item.name} - ${item.price} сом</option>`;
        });
    }
    
    window.quickOrder = function(idx) {
        document.querySelector('[data-tab="order-tab"]').click();
        document.getElementById("orderProduct").value = idx;
        document.getElementById("orderQty").value = 1;
        window.scrollTo({ top: document.getElementById("order-tab").offsetTop, behavior: "smooth" });
    };
    
    // ====================== BUYURTMA ======================
    document.getElementById("submitDeliveryOrder").onclick = async () => {
        const name = document.getElementById("orderName").value.trim();
        const phone = document.getElementById("orderPhone").value.trim();
        const productIdx = parseInt(document.getElementById("orderProduct").value);
        const qty = parseInt(document.getElementById("orderQty").value);
        const address = document.getElementById("orderAddress").value.trim();
        
        if (!name || !phone || !address) { 
            showMsg("orderMessage", "Атыңызды, телефонуңузду жана дарегиңизди жазыңыз!", "error"); 
            return; 
        }
        if (isNaN(productIdx) || !menu[productIdx]) {
            showMsg("orderMessage", "Тамакты тандаңыз!", "error");
            return;
        }
        
        const item = menu[productIdx];
        const order = { 
            type: "delivery", 
            name: name, 
            phone: phone, 
            product: item.name, 
            qty: qty, 
            total: item.price * qty, 
            address: address 
        };
        
        const sent = await sendTelegram(order);
        if (sent) {
            showMsg("orderMessage", "✅ Заказ кабыл алынды! Сиз менен байланышабыз.", "success");
            document.getElementById("orderName").value = "";
            document.getElementById("orderPhone").value = "";
            document.getElementById("orderAddress").value = "";
            document.getElementById("orderQty").value = "1";
        } else {
            showMsg("orderMessage", "❌ Ката кетти. Кийинчерээк аракет кылыңыз.", "error");
        }
    };
    
    // ====================== STOL BAND QILISH ======================
    document.getElementById("submitReserve").onclick = async () => {
        const name = document.getElementById("reserveName").value.trim();
        const phone = document.getElementById("reservePhone").value.trim();
        const date = document.getElementById("reserveDate").value;
        const time = document.getElementById("reserveTime").value;
        const table = document.getElementById("reserveTable").value;
        const guests = document.getElementById("reserveGuests").value;
        
        if (!name || !phone || !date || !time || !table) { 
            showMsg("reserveMessage", "Бардык талааларды толтуруңуз!", "error"); 
            return; 
        }
        
        const order = { 
            type: "reserve", 
            name: name, 
            phone: phone, 
            table: table, 
            guests: guests || 1, 
            dateTime: `${date} ${time}` 
        };
        
        const sent = await sendTelegram(order);
        if (sent) {
            showMsg("reserveMessage", "✅ Стол заказдалды!", "success");
            document.getElementById("reserveName").value = "";
            document.getElementById("reservePhone").value = "";
            document.getElementById("reserveDate").value = "";
            document.getElementById("reserveTime").value = "";
            document.getElementById("reserveTable").value = "";
            document.getElementById("reserveGuests").value = "";
        } else {
            showMsg("reserveMessage", "❌ Ката кетти", "error");
        }
    };
    
    // ====================== NAVIGATSIYA ======================
    document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active-tab"));
            document.getElementById(btn.dataset.tab).classList.add("active-tab");
        });
    });
    
    // ====================== TIL VA THEMA ======================
    document.getElementById("langToggle").onclick = () => setLanguage(currentLang === "ky" ? "uz" : "ky");
    document.getElementById("themeToggle").onclick = toggleTheme;
    
    const savedLang = localStorage.getItem("lang");
    if (savedLang) setLanguage(savedLang);
    else setLanguage("ky");
    
    if (currentTheme === "dark") document.body.classList.add("dark");
    
    loadMenu();
    
    // Bot token mavjudligini tekshirish
    console.log("Bot token:", BOT_TOKEN);
    console.log("Chat ID:", CHAT_ID);
</script>
</body>
</html>

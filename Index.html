<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Restoran | Menyu va Buyurtma</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #fef8ed 0%, #f9efdf 100%);
            min-height: 100vh;
            color: #2d1a0e;
        }
        .header {
            background: linear-gradient(135deg, #6b3e1c, #8b5a2b);
            color: white;
            padding: 25px 20px;
            text-align: center;
            border-radius: 0 0 35px 35px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .header h1 { font-size: 2rem; letter-spacing: -0.5px; }
        .header p { opacity: 0.9; margin-top: 5px; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        .section-title {
            font-size: 1.6rem;
            margin: 25px 0 15px;
            color: #6b3e1c;
            border-left: 5px solid #e67e22;
            padding-left: 15px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }
        .menu-card {
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 12px 28px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(230,126,34,0.2);
        }
        .menu-card:hover { transform: translateY(-8px); box-shadow: 0 20px 35px rgba(0,0,0,0.12); }
        .menu-img {
            height: 160px;
            background: linear-gradient(145deg, #e8d5b5, #d4b896);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
        .menu-info { padding: 18px; text-align: center; }
        .menu-info h3 { font-size: 1.4rem; color: #3e2a1f; }
        .price { font-size: 1.7rem; font-weight: bold; color: #e67e22; margin: 10px 0; }
        .order-btn, .book-btn {
            background: #e67e22;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .order-btn:hover, .book-btn:hover { background: #d35400; }
        .form-card {
            background: white;
            border-radius: 35px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.08);
        }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; }
        .form-row input, .form-row select, .form-row textarea {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid #e2d4c4;
            border-radius: 50px;
            font-size: 1rem;
            background: #fefbf5;
        }
        textarea { border-radius: 25px !important; resize: vertical; }
        .submit-btn {
            background: #27ae60;
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            color: white;
            border: none;
            cursor: pointer;
        }
        .tabs {
            display: flex;
            gap: 12px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .tab-btn.active {
            background: #6b3e1c;
            color: white;
        }
        .tab-pane { display: none; }
        .tab-pane.active-tab { display: block; }
        footer { text-align: center; padding: 30px; color: #a68a6a; font-size: 0.8rem; }
        .message {
            padding: 12px;
            border-radius: 50px;
            margin-top: 15px;
            display: none;
            text-align: center;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        @media (max-width: 600px) {
            .header h1 { font-size: 1.5rem; }
            .section-title { font-size: 1.3rem; }
            .form-row { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="header">
    <h1>🍽️ Oshxona Restoran</h1>
    <p>Mazali taomlar | Issiq muhit | Tez yetkazib berish</p>
</div>
<div class="container">
    <!-- Tab menyusi -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="menu-tab">📋 Menyu</button>
        <button class="tab-btn" data-tab="order-tab">🛍️ Buyurtma</button>
        <button class="tab-btn" data-tab="reserve-tab">🪑 Stol band qilish</button>
    </div>

    <!-- Menyu qismi -->
    <div id="menu-tab" class="tab-pane active-tab">
        <h2 class="section-title">Bizning menyu</h2>
        <div class="menu-grid" id="menuGrid"></div>
    </div>

    <!-- Buyurtma qismi -->
    <div id="order-tab" class="tab-pane">
        <h2 class="section-title">Yetkazib berish orqali buyurtma</h2>
        <div class="form-card">
            <div class="form-row"><input type="text" id="orderName" placeholder="Ismingiz"></div>
            <div class="form-row"><input type="tel" id="orderPhone" placeholder="Telefon raqam"></div>
            <div class="form-row"><select id="orderProduct"></select></div>
            <div class="form-row"><input type="number" id="orderQty" placeholder="Miqdor" value="1" min="1"></div>
            <div class="form-row"><textarea id="orderAddress" rows="2" placeholder="Yetkazib berish manzili (ko'cha, uy, kirish)"></textarea></div>
            <button class="submit-btn" id="submitDeliveryOrder">🚚 Buyurtma berish</button>
            <div id="orderMessage" class="message"></div>
        </div>
    </div>

    <!-- Stol band qilish -->
    <div id="reserve-tab" class="tab-pane">
        <h2 class="section-title">Restoranda stol band qilish</h2>
        <div class="form-card">
            <div class="form-row"><input type="text" id="reserveName" placeholder="Ismingiz"></div>
            <div class="form-row"><input type="tel" id="reservePhone" placeholder="Telefon raqam"></div>
            <div class="form-row"><input type="date" id="reserveDate"></div>
            <div class="form-row"><input type="time" id="reserveTime"></div>
            <div class="form-row"><input type="number" id="reserveTable" placeholder="Stol raqami (masalan: 5)"></div>
            <div class="form-row"><input type="number" id="reserveGuests" placeholder="Kishilar soni" min="1"></div>
            <button class="submit-btn" id="submitReserve">✅ Stol band qilish</button>
            <div id="reserveMessage" class="message"></div>
        </div>
    </div>
    <footer>© 2025 | Barcha huquqlar himoyalangan</footer>
</div>
<script>
    // ====================== SOZLAMALAR ======================
    const REPO_OWNER = "ilmyolida";
    const REPO_NAME = "Restaurants";
    const FILE_ORDERS = "orders.json";
    let menu = [];
    let githubToken = localStorage.getItem("github_token") || "";

    async function fetchJSON(filename) {
        const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${filename}`;
        try { const res = await fetch(url); if (!res.ok) return []; return await res.json(); } catch(e) { return []; }
    }
    async function saveOrder(orderData) {
        if (!githubToken) { showMsg("orderMessage", "❌ Tizimda xatolik, keyinroq urinib ko'ring", "error"); return false; }
        const existing = await fetchJSON(FILE_ORDERS);
        const newOrders = Array.isArray(existing) ? [...existing, orderData] : [orderData];
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_ORDERS}`;
        let sha = "";
        try {
            const res = await fetch(url, { headers: { Authorization: `token ${githubToken}` } });
            if (res.ok) { const file = await res.json(); sha = file.sha; }
        } catch(e) {}
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(newOrders, null, 2))));
        const body = JSON.stringify({ message: `New order`, content, sha });
        const res = await fetch(url, { method: "PUT", headers: { Authorization: `token ${githubToken}`, "Content-Type": "application/json" }, body });
        return res.ok;
    }
    function showMsg(elId, text, type) {
        const el = document.getElementById(elId);
        if (el) { el.innerText = text; el.className = `message ${type}`; el.style.display = "block"; setTimeout(() => el.style.display = "none", 5000); }
    }
    async function loadMenu() {
        const data = await fetchJSON("menu.json");
        if (data.length) menu = data;
        else menu = [{ name: "Бешбармак", price: 300, icon: "🍲" }, { name: "Манты", price: 250, icon: "🥟" }, { name: "Лагман", price: 220, icon: "🍜" }];
        const grid = document.getElementById("menuGrid");
        const select = document.getElementById("orderProduct");
        grid.innerHTML = ""; select.innerHTML = "";
        menu.forEach((item, idx) => {
            grid.innerHTML += `<div class="menu-card"><div class="menu-img">${item.icon || "🍽️"}</div><div class="menu-info"><h3>${item.name}</h3><div class="price">${item.price} сом</div><button class="order-btn" onclick="quickOrder(${idx})">🛒 Buyurtma</button></div></div>`;
            select.innerHTML += `<option value="${idx}">${item.name} - ${item.price} сом</option>`;
        });
    }
    window.quickOrder = function(idx) {
        document.querySelector('[data-tab="order-tab"]').click();
        document.getElementById("orderProduct").value = idx;
        document.getElementById("orderQty").value = 1;
        window.scrollTo({ top: document.getElementById("order-tab").offsetTop, behavior: "smooth" });
    };
    document.getElementById("submitDeliveryOrder").onclick = async () => {
        const name = document.getElementById("orderName").value.trim();
        const phone = document.getElementById("orderPhone").value.trim();
        const productIdx = parseInt(document.getElementById("orderProduct").value);
        const qty = parseInt(document.getElementById("orderQty").value);
        const address = document.getElementById("orderAddress").value.trim();
        if (!name || !phone || !address) { showMsg("orderMessage", "Ism, telefon va manzilni kiriting!", "error"); return; }
        const item = menu[productIdx];
        const order = { id: Date.now(), type: "delivery", date: new Date().toISOString(), name, phone, product: item.name, qty, price: item.price, total: item.price * qty, address, status: "new" };
        if (await saveOrder(order)) { showMsg("orderMessage", "✅ Buyurtma qabul qilindi!", "success"); document.getElementById("orderName").value = ""; document.getElementById("orderPhone").value = ""; document.getElementById("orderAddress").value = ""; document.getElementById("orderQty").value = "1"; }
        else showMsg("orderMessage", "❌ Xatolik", "error");
    };
    document.getElementById("submitReserve").onclick = async () => {
        const name = document.getElementById("reserveName").value.trim();
        const phone = document.getElementById("reservePhone").value.trim();
        const date = document.getElementById("reserveDate").value;
        const time = document.getElementById("reserveTime").value;
        const table = document.getElementById("reserveTable").value;
        const guests = document.getElementById("reserveGuests").value;
        if (!name || !phone || !date || !time) { showMsg("reserveMessage", "Barcha maydonlarni to'ldiring!", "error"); return; }
        const reserve = { id: Date.now(), type: "reserve", dateTime: `${date} ${time}`, name, phone, table, guests, status: "new" };
        if (await saveOrder(reserve)) { showMsg("reserveMessage", "✅ Stol band qilindi!", "success"); document.getElementById("reserveName").value = ""; document.getElementById("reservePhone").value = ""; document.getElementById("reserveDate").value = ""; document.getElementById("reserveTime").value = ""; document.getElementById("reserveTable").value = ""; document.getElementById("reserveGuests").value = ""; }
        else showMsg("reserveMessage", "❌ Xatolik", "error");
    };
    document.querySelectorAll(".tab-btn").forEach(btn => { btn.addEventListener("click", () => { document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active")); btn.classList.add("active"); document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active-tab")); document.getElementById(btn.dataset.tab).classList.add("active-tab"); }); });
    if (localStorage.getItem("github_token")) githubToken = localStorage.getItem("github_token");
    loadMenu();
</script>
</body>
            </html>

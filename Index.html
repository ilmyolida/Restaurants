<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Restoran | Меню жана Заказ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* ====================== O'ZGARUVCHILAR ====================== */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-primary: #2c3e50;
            --text-secondary: #6c757d;
            --card-bg: #ffffff;
            --border-color: #e9ecef;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
            --nav-bg: #f8f9fa;
            --input-bg: #ffffff;
            --accent: #e67e22;
        }
        
        body.dark {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --text-primary: #f5f0e8;
            --text-secondary: #aaa;
            --card-bg: #1a1a1a;
            --border-color: #2a2a2a;
            --shadow: 0 10px 30px rgba(0,0,0,0.3);
            --nav-bg: #1a1a1a;
            --input-bg: #0d0d0d;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s ease;
            min-height: 100vh;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, var(--accent), #d35400);
            color: white;
            padding: 30px 20px;
            text-align: center;
            position: relative;
        }
        .header h1 { font-size: 2rem; margin-bottom: 8px; }
        .header p { opacity: 0.9; }
        
        /* Tema va til tugmalari */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 12px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .top-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            color: var(--text-primary);
            font-weight: 500;
            transition: 0.2s;
        }
        .top-btn:hover { border-color: var(--accent); color: var(--accent); }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 12px;
            margin: 20px 0 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-primary);
            transition: 0.2s;
        }
        .tab-btn:hover { border-color: var(--accent); color: var(--accent); }
        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: transparent;
        }
        
        .section-title {
            font-size: 1.6rem;
            margin: 20px 0 25px;
            color: var(--accent);
            border-left: 4px solid var(--accent);
            padding-left: 15px;
        }
        
        /* Menu grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .menu-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: 0.3s;
            cursor: pointer;
        }
        .menu-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: var(--shadow);
        }
        .menu-img {
            height: 160px;
            background: linear-gradient(145deg, #f0e0c0, #e8d5b5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
        body.dark .menu-img { background: linear-gradient(145deg, #2a2a2a, #1f1f1f); }
        .menu-info { padding: 18px; text-align: center; }
        .menu-info h3 { font-size: 1.3rem; margin-bottom: 6px; }
        .price { font-size: 1.5rem; font-weight: bold; color: var(--accent); margin: 10px 0; }
        .order-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .order-btn:hover { opacity: 0.9; transform: scale(1.02); }
        
        /* Form card */
        .form-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            border: 1px solid var(--border-color);
        }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; }
        .form-row input, .form-row select, .form-row textarea {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 50px;
            background: var(--input-bg);
            color: var(--text-primary);
        }
        textarea { border-radius: 20px !important; resize: vertical; }
        .submit-btn {
            background: #27ae60;
            width: 100%;
            padding: 12px;
            border-radius: 50px;
            font-weight: bold;
            color: white;
            border: none;
            cursor: pointer;
        }
        
        .tab-pane { display: none; animation: fade 0.3s; }
        .tab-pane.active-tab { display: block; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        
        footer { text-align: center; padding: 30px; color: var(--text-secondary); border-top: 1px solid var(--border-color); margin-top: 40px; }
        
        .message {
            padding: 10px;
            border-radius: 50px;
            margin-top: 15px;
            display: none;
            text-align: center;
        }
        .success { background: rgba(39,174,96,0.2); color: #27ae60; }
        .error { background: rgba(231,76,60,0.2); color: #e74c3c; }
        
        @media (max-width: 600px) {
            .header h1 { font-size: 1.4rem; }
            .section-title { font-size: 1.3rem; }
            .form-row { flex-direction: column; }
            .tab-btn { padding: 8px 18px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="top-bar">
    <button class="top-btn" id="langToggle">🇺🇿 O'zbekcha</button>
    <button class="top-btn" id="themeToggle">🌙 Dark</button>
</div>
<div class="header">
    <h1 id="mainTitle">🍽️ Kafe & Ресторан</h1>
    <p id="subTitle">Табигый даам | Жылуу маанай | Тез жеткирүү</p>
</div>
<div class="container">
    <div class="tabs">
        <button class="tab-btn active" data-tab="menu-tab" id="tabMenu">📋 Меню</button>
        <button class="tab-btn" data-tab="order-tab" id="tabOrder">🚚 Заказ берүү</button>
        <button class="tab-btn" data-tab="reserve-tab" id="tabReserve">🪑 Стол заказдоо</button>
    </div>

    <div id="menu-tab" class="tab-pane active-tab">
        <h2 class="section-title" id="menuTitle">Биздин меню</h2>
        <div class="menu-grid" id="menuGrid"></div>
    </div>

    <div id="order-tab" class="tab-pane">
        <h2 class="section-title" id="orderTitle">Жеткирүү менен заказ</h2>
        <div class="form-card">
            <div class="form-row"><input type="text" id="orderName" placeholder="Атыңыз"></div>
            <div class="form-row"><input type="tel" id="orderPhone" placeholder="Телефон номери"></div>
            <div class="form-row"><select id="orderProduct"></select></div>
            <div class="form-row"><input type="number" id="orderQty" placeholder="Саны" value="1" min="1"></div>
            <div class="form-row"><textarea id="orderAddress" rows="2" placeholder="Дарегиңиз"></textarea></div>
            <button class="submit-btn" id="submitDeliveryOrder">📦 Заказ берүү</button>
            <div id="orderMessage" class="message"></div>
        </div>
    </div>

    <div id="reserve-tab" class="tab-pane">
        <h2 class="section-title" id="reserveTitle">Стол заказдоо</h2>
        <div class="form-card">
            <div class="form-row"><input type="text" id="reserveName" placeholder="Атыңыз"></div>
            <div class="form-row"><input type="tel" id="reservePhone" placeholder="Телефон номери"></div>
            <div class="form-row"><input type="date" id="reserveDate"></div>
            <div class="form-row"><input type="time" id="reserveTime"></div>
            <div class="form-row"><input type="number" id="reserveTable" placeholder="Стол номери"></div>
            <div class="form-row"><input type="number" id="reserveGuests" placeholder="Адам саны" min="1"></div>
            <button class="submit-btn" id="submitReserve">✅ Стол заказдоо</button>
            <div id="reserveMessage" class="message"></div>
        </div>
    </div>
    
    <footer>© 2025 | Бардык укуктар корголгон</footer>
</div>

<script>
    // ====================== SOZLAMALAR ======================
    const REPO_OWNER = "ilmyolida";
    const REPO_NAME = "Restaurants";
    const FILE_ORDERS = "orders.json";
    const BOT_TOKEN = "8863904509:AAFCnx-finHBwgL5RaglmLrsOVI_X2_np8I";
    const CHAT_ID = "6360110232";
    
    let menu = [];
    let githubToken = localStorage.getItem("github_token") || "";
    let currentLang = "ky";
    let currentTheme = localStorage.getItem("theme") || "light";
    
    // ====================== TIL MATNLARI ======================
    const translations = {
        ky: {
            mainTitle: "🍽️ Kafe & Ресторан",
            subTitle: "Табигый даам | Жылуу маанай | Тез жеткирүү",
            tabMenu: "📋 Меню",
            tabOrder: "🚚 Заказ берүү",
            tabReserve: "🪑 Стол заказдоо",
            menuTitle: "Биздин меню",
            orderTitle: "Жеткирүү менен заказ",
            reserveTitle: "Стол заказдоо",
            orderBtn: "📦 Заказ берүү",
            reserveBtn: "✅ Стол заказдоо"
        },
        uz: {
            mainTitle: "🍽️ Kafe & Restoran",
            subTitle: "Tabiiy taom | Issiq muhit | Tez yetkazib berish",
            tabMenu: "📋 Menyu",
            tabOrder: "🚚 Buyurtma berish",
            tabReserve: "🪑 Stol band qilish",
            menuTitle: "Bizning menyu",
            orderTitle: "Yetkazib berish orqali buyurtma",
            reserveTitle: "Restoranda stol band qilish",
            orderBtn: "📦 Buyurtma berish",
            reserveBtn: "✅ Stol band qilish"
        }
    };
    
    function setLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        document.getElementById("mainTitle").innerText = t.mainTitle;
        document.getElementById("subTitle").innerText = t.subTitle;
        document.getElementById("tabMenu").innerText = t.tabMenu;
        document.getElementById("tabOrder").innerText = t.tabOrder;
        document.getElementById("tabReserve").innerText = t.tabReserve;
        document.getElementById("menuTitle").innerText = t.menuTitle;
        document.getElementById("orderTitle").innerText = t.orderTitle;
        document.getElementById("reserveTitle").innerText = t.reserveTitle;
        document.getElementById("submitDeliveryOrder").innerText = t.orderBtn;
        document.getElementById("submitReserve").innerText = t.reserveBtn;
        localStorage.setItem("lang", lang);
    }
    
    // ====================== THEME ======================
    function setTheme(theme) {
        currentTheme = theme;
        if (theme === "dark") {
            document.body.classList.add("dark");
            document.getElementById("themeToggle").innerHTML = "☀️ Light";
        } else {
            document.body.classList.remove("dark");
            document.getElementById("themeToggle").innerHTML = "🌙 Dark";
        }
        localStorage.setItem("theme", theme);
    }
    
    function toggleTheme() {
        setTheme(currentTheme === "dark" ? "light" : "dark");
    }
    
    // ====================== GITHUB FUNCTIONS ======================
    async function fetchJSON(filename) {
        const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${filename}`;
        try { const res = await fetch(url); if (!res.ok) return []; return await res.json(); } catch(e) { return []; }
    }
    
    async function saveOrder(orderData) {
        if (!githubToken) { 
            alert("⚠️ GitHub token kiritilmagan! Admin panelda tokenni sozlang.");
            return false; 
        }
        const existing = await fetchJSON(FILE_ORDERS);
        const newOrders = Array.isArray(existing) ? [...existing, orderData] : [orderData];
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_ORDERS}`;
        let sha = "";
        try {
            const res = await fetch(url, { headers: { Authorization: `token ${githubToken}` } });
            if (res.ok) { const file = await res.json(); sha = file.sha; }
        } catch(e) {}
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(newOrders, null, 2))));
        const body = JSON.stringify({ message: `New order ${orderData.id}`, content, sha });
        const res = await fetch(url, { method: "PUT", headers: { Authorization: `token ${githubToken}`, "Content-Type": "application/json" }, body });
        if (res.ok) { await sendTelegram(orderData); return true; }
        return false;
    }
    
    async function sendTelegram(order) {
        let msg = "";
        if (order.type === "delivery") {
            msg = `🆕 ЯНГЫ ЗАКАЗ!\n━━━━━━━━━━━━━━━\n👤 Аты: ${order.name}\n📞 Тел: ${order.phone}\n🍽 Тамак: ${order.product}\n🔢 Саны: ${order.qty}\n💰 Жалпы: ${order.total} сом\n📍 Дареги: ${order.address}`;
        } else {
            msg = `🆕 СТОЛ ЗАКАЗДОО!\n━━━━━━━━━━━━━━━\n👤 Аты: ${order.name}\n📞 Тел: ${order.phone}\n🪑 Стол: №${order.table}\n👥 Адам: ${order.guests}\n📅 Убакыт: ${order.dateTime}`;
        }
        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: msg })
            });
        } catch(e) {}
    }
    
    function showMsg(elId, text, type) {
        const el = document.getElementById(elId);
        if (el) { el.innerText = text; el.className = `message ${type}`; el.style.display = "block"; setTimeout(() => el.style.display = "none", 4000); }
    }
    
    // ====================== MENU ======================
    async function loadMenu() {
        const data = await fetchJSON("menu.json");
        if (data.length) menu = data;
        else menu = [
            { name: "Бешбармак", price: 300, icon: "🍲", desc: "Классикалык кыргыз тамагы" },
            { name: "Манты", price: 250, icon: "🥟", desc: "Бууга бышырылган" },
            { name: "Лагман", price: 220, icon: "🍜", desc: "Колго согулган кесме" },
            { name: "Куурдак", price: 350, icon: "🍖", desc: "Козу эти менен" },
            { name: "Плов", price: 280, icon: "🍚", desc: "Тойгонго даамдуу" },
            { name: "Шорпо", price: 180, icon: "🥣", desc: "Ысык сорпо" }
        ];
        const grid = document.getElementById("menuGrid");
        const select = document.getElementById("orderProduct");
        grid.innerHTML = ""; select.innerHTML = "";
        menu.forEach((item, idx) => {
            grid.innerHTML += `<div class="menu-card" onclick="quickOrder(${idx})"><div class="menu-img">${item.icon || "🍽️"}</div><div class="menu-info"><h3>${item.name}</h3><div class="price">${item.price} сом</div><p style="font-size:0.8rem; color:#888;">${item.desc || ""}</p><button class="order-btn">🛒 Заказ берүү</button></div></div>`;
            select.innerHTML += `<option value="${idx}">${item.name} - ${item.price} сом</option>`;
        });
    }
    
    window.quickOrder = function(idx) {
        document.querySelector('[data-tab="order-tab"]').click();
        document.getElementById("orderProduct").value = idx;
        document.getElementById("orderQty").value = 1;
    };
    
    // ====================== EVENTLAR ======================
    document.getElementById("submitDeliveryOrder").onclick = async () => {
        const name = document.getElementById("orderName").value.trim();
        const phone = document.getElementById("orderPhone").value.trim();
        const productIdx = parseInt(document.getElementById("orderProduct").value);
        const qty = parseInt(document.getElementById("orderQty").value);
        const address = document.getElementById("orderAddress").value.trim();
        if (!name || !phone || !address) { showMsg("orderMessage", "Бардык талааларды толтуруңуз!", "error"); return; }
        const item = menu[productIdx];
        const order = { id: Date.now(), type: "delivery", date: new Date().toISOString(), name, phone, product: item.name, qty, price: item.price, total: item.price * qty, address };
        if (await saveOrder(order)) {
            showMsg("orderMessage", "✅ Заказ кабыл алынды!", "success");
            document.getElementById("orderName").value = ""; document.getElementById("orderPhone").value = ""; document.getElementById("orderAddress").value = ""; document.getElementById("orderQty").value = "1";
        } else { showMsg("orderMessage", "❌ Ката кетти. GitHub токенди текшериңиз.", "error"); }
    };
    
    document.getElementById("submitReserve").onclick = async () => {
        const name = document.getElementById("reserveName").value.trim();
        const phone = document.getElementById("reservePhone").value.trim();
        const date = document.getElementById("reserveDate").value;
        const time = document.getElementById("reserveTime").value;
        const table = document.getElementById("reserveTable").value;
        const guests = document.getElementById("reserveGuests").value;
        if (!name || !phone || !date || !time || !table) { showMsg("reserveMessage", "Бардык талааларды толтуруңуз!", "error"); return; }
        const reserve = { id: Date.now(), type: "reserve", dateTime: `${date} ${time}`, name, phone, table, guests: guests || 1 };
        if (await saveOrder(reserve)) {
            showMsg("reserveMessage", "✅ Стол заказдалды!", "success");
            document.getElementById("reserveName").value = ""; document.getElementById("reservePhone").value = ""; document.getElementById("reserveDate").value = ""; document.getElementById("reserveTime").value = ""; document.getElementById("reserveTable").value = ""; document.getElementById("reserveGuests").value = "";
        } else { showMsg("reserveMessage", "❌ Ката кетти", "error"); }
    };
    
    // Admin token sozlamalari (prompt orqali)
    setTimeout(() => {
        let savedToken = localStorage.getItem("github_token");
        if (!savedToken) {
            let token = prompt("🔐 Admin panel uchun GitHub token kiriting (menyuni yangilash va buyurtmalarni saqlash uchun):");
            if (token && token.length > 10) {
                localStorage.setItem("github_token", token);
                githubToken = token;
                alert("✅ Token saqlandi!");
                location.reload();
            }
        } else {
            githubToken = savedToken;
        }
    }, 500);
    
    // Navigatsiya
    document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remo
